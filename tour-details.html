<!DOCTYPE html>
<html lang="en">
<head>
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<meta charset="UTF-8">
<title>Tour Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.css">
<link rel="stylesheet" href="css/font-awesome.min.css">

<style>
body {
  background: #f5f5f5;
  font-size: 15px;
}

/* Banner */
.tour-banner img {
  width: 100%;
  height: 420px;
  object-fit: cover;
}

/* Title */
.tour-title {
  text-align: center;
  font-weight: 700;
  margin-top: 20px;
}

/* Info Bar */
.tour-info-box {
  display: flex;
  justify-content: space-between;
  background: #fff;
  padding: 20px;
  margin: 20px auto;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  text-align: center;
  gap: 10px;
}

.tour-info-box div {
  flex: 1;
}

.tour-info-box i {
  color: #ffae00;
  font-size: 22px;
}

/* Cards */
.card-box {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  border-radius: 8px;
}

/* Included / Excluded */
.list-icon {
  list-style: none;
  padding: 0;
  margin: 0;
}

.list-icon li {
  margin-bottom: 8px;
}

.list-icon li i {
  margin-right: 8px;
}

.included i {
  color: green;
}

.excluded i {
  color: goldenrod;
}

/* Yellow Button */
.btn-primary {
  background-color: #ffae00;
  border-color: #ffae00;
  color: #000;
  font-weight: 600;
  border-radius: 30px;
  padding: 10px 22px;
  box-shadow: 0 4px 12px rgba(255,174,0,0.4);
}

.btn-primary:hover {
  background-color: #e69c00;
  border-color: #e69c00;
  color: #000;
}

/* ========================= */
/* MOBILE RESPONSIVE RULES */
/* ========================= */

@media (max-width: 768px) {

  /* Banner */
  .tour-banner img {
    height: 250px;
  }

  /* Info Bar stacks */
  .tour-info-box {
    flex-wrap: wrap;
  }

  .tour-info-box div {
    width: 50%;
    margin-bottom: 15px;
  }

  /* Text spacing */
  .card-box {
    padding: 15px;
  }

  /* Button full width */
  .btn-primary {
    width: 100%;
    text-align: center;
  }
}

@media (max-width: 480px) {

  .tour-info-box div {
    width: 100%;
  }

  .tour-title {
    font-size: 20px;
  }

}
.whatsapp-float,
.facebook-float {
  position: fixed;
  right: 12px;        /* smaller for mobile */
  width: 48px;
  height: 48px;
  border-radius: 50%;
  text-align: center;
  font-size: 22px;
  z-index: 9999;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

/* WhatsApp */
.whatsapp-float {
  bottom: 20px;
  background-color: #25d366;
  color: #fff;
}

/* Facebook */
.facebook-float {
  bottom: 78px;
  background-color: #1877f2;
  color: #fff;
}

.whatsapp-float i,
.facebook-float i {
  line-height: 48px;
}
html, body {
  max-width: 100%;
  overflow-x: hidden;
}

/* Back to Tours Button (Force Style) */
.back-tour-btn {
    display: inline-block !important;
    background: #f4b400 !important;
    color: #ffffff !important;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none !important;
    border: none;
    transition: all 0.25s ease;
}

/* Hover */
.back-tour-btn:hover {
    background: #d89c00 !important;
    color: #ffffff !important;
    text-decoration: none !important;
    transform: translateY(-1px);
}

/* Icon spacing */
.back-tour-btn i {
    margin-right: 6px;
}

/* new */
.tour-day {
  margin-bottom: 15px;
}

.tour-day strong {
  display: block;
  margin-bottom: 6px;
}

.tour-day ul {
  padding-left: 18px;
  margin: 0;
}

.tour-day li {
  margin-bottom: 4px;
}

/* Mobile spacing */
@media (max-width: 768px) {
  .tour-day {
    margin-bottom: 12px;
  }
}


</style>
</head>

<a href="index.html#tour-prices" class="back-tour-btn">

</div>

const tourId = params.get("tour");
const tour = tours[tourId];

if (!tour) return;

document.getElementById("tourImage").src = tour.image;
document.getElementById("tourTitle").innerText = tour.title;
document.getElementById("tourDuration").innerText = tour.duration;
document.getElementById("tourPeople").innerText = tour.people;
document.getElementById("tourPrice").innerText = tour.price;
document.getElementById("tourType").innerText = tour.type;
document.getElementById("tourDescription").innerText = tour.description;
const planContainer = document.getElementById("tourPlan");

tour.plan.forEach(day => {
  let activitiesHTML = "";

  day.activities.forEach(act => {
    activitiesHTML += `<li>${act}</li>`;
  });

  planContainer.innerHTML += `
    <div class="tour-day">
      <strong>${day.day}: ${day.title}</strong>
      <ul>${activitiesHTML}</ul>
    </div>
  `;
});

  document.getElementById("includedList").innerHTML +=
    `<li><i class="fa fa-check-circle"></i>${item}</li>`;
});
